<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Thank you — Sabai Dee Thai massage &amp; Spa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Thai:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>

    <header class="site-header">
      <div class="header-brand">
        <a class="logo" href="https://sabaidee.co.il/" data-site-home data-i18n-aria="logo_aria">
          <span class="logo-stack">
            <img
              class="logo-img"
              src="images/logo.png"
              width="64"
              height="64"
              decoding="async"
              alt=""
              role="presentation"
            />
            <span class="logo-tagline" data-i18n="logo_tagline">Sabai Dee Thai massage &amp; Spa</span>
          </span>
        </a>
      </div>
      <div class="header-bar">
        <span class="header-spacer" aria-hidden="true"></span>
        <div class="header-tools">
          <div class="lang-switch" role="group" data-i18n-aria="lang_label">
            <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
            <button type="button" class="lang-btn" data-lang="he" aria-pressed="false">עב</button>
            <button type="button" class="lang-btn" data-lang="th" aria-pressed="false">ไทย</button>
          </div>
        </div>
      </div>
    </header>

    <main class="thank-you-page">
      <div class="thank-you-card">
        <h1 data-i18n="thank_you_title">Thank you</h1>
        <p data-i18n="thank_you_lede">We received your message and will reply soon by email or phone.</p>
        <div class="thank-you-actions">
          <a class="btn btn-primary" href="https://sabaidee.co.il/" data-site-home data-i18n="thank_you_back">Back to home</a>
          <p class="thank-you-phone">
            <span data-i18n="thank_you_call">Or call for appointments:</span>
            <a href="tel:+972559906352" data-i18n-tel="phone_spa_tel" data-i18n="phone_spa_display">055-990-6352</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> <span data-i18n="footer_tag">Sabai Dee Thai massage &amp; Spa · Jerusalem</span></p>
    </footer>

    <script src="i18n.js"></script>
    <script src="main.js"></script>
  </body>
</html>
